# ROOT application-docker.yml
# Loaded when SPRING_PROFILES_ACTIVE=dev,docker for ALL services.
# Overrides the localhost-based application-dev.yml values with Docker service names.
# Spring profile resolution order (last wins): application.yml → application-dev.yml → application-docker.yml

spring:
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: false # override root application.yml
    hostname: ${spring.application.name} # each service registers by its name

logging:
  pattern:
    # For distributed tracing using Open Telemetry
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"