# ROOT application-prod.yml
# Production overrides inherited by ALL services.

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}

management:
  endpoint:
    health:
      # In prod, hide internal details from public health endpoint
      show-details: when-authorized

springdoc:
  swagger-ui:
    # Disable Swagger UI in production
    enabled: false
  api-docs:
    enabled: false
