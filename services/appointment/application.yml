# config for appointment (all profiles)

server:
  port: 8084

spring:
  application:
    name: appointment

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  cloud:
    openfeign:
      okhttp:
        enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: appointment
    default-schema: appointment

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default-schema: appointment

  data:
    redis:
      database: 0

rabbitmq:
  # Central exchange for LuneCare messaging
  exchange:
    name: lune.care.exchange
  queues:
    # Queue for sending appointment-related notifications
    notification: appointment.notification.queue

    # Queue for handling payment-related events
    payment: appointment.payment.queue

resilience4j:
  circuitbreaker:
    instances:
      doctor-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

  retry:
    instances:
      doctor-service:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.healthcare.appointment.exception.AppointmentException
          - com.healthcare.appointment.exception.SlotException

app:
  appointment:
    # Time (in hours) before appointment after which cancellation is not allowed
    cancellation-cutoff-hours: 2
    # Time (in minutes) allowed to complete payment before expiration
    payment-timeout-minutes: 15

info:
  app:
    name: "LuneCare Appointment Service"
    version: "v1.0.0"
    description: "Service responsible for managing appointment scheduling, coordination, and related workflows within the LuneCare healthcare microservices ecosystem."
