# config for appointment (all profiles)

server:
  port: 8084

spring:
  application:
    name: appointment

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  cloud:
    openfeign:
      okhttp:
        enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      database: 0

rabbitmq:
  exchange:
    name: lune.care.exchange
  queues:
    notification: appointment.notification.queue
    payment: appointment.payment.queue

app:
  appointment:
    cancellation-cutoff-hours: 2
    payment-timeout-minutes: 15

info:
  app:
    name: "LuneCare Appointment Service"
    version: "v1.0.0"
    description: "Service for managing appointment scheduling and workflows."
