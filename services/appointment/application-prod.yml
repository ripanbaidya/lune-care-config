# config for appointment - prod

spring:
  datasource:
    url: ${APPOINTMENT_DB_URL}
    username: ${APPOINTMENT_DB_USERNAME}
    password: ${APPOINTMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
