# config for doctor (all profiles)

server:
  port: 8083

spring:
  application:
    name: doctor

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      # Enable file upload support
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  cloud:
    openfeign:
      okhttp:
        enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  integrations:
