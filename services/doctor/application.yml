# config for doctor (all profiles)

server:
  port: 8083

spring:
  application:
    name: doctor

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      # Enable file upload support
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  cloud:
    openfeign:
      okhttp:
        enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: doctor
    default-schema: doctor

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default-schema: doctor
  
  data:
    redis:
      database: 0

resilience4j:
  circuitbreaker:
    instances:
      # Guards all calls to auth-service (syncStatusWithAuthService in DoctorServiceImpl)
      # Critical path: doctor onboarding + verification status sync
      auth-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50 # Open after 5/10 failures
        wait-duration-in-open-state: 30s # Stay open 30s before probing
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
 
  retry:
    instances:
      # Used by: syncStatusWithAuthService in DoctorServiceImpl
      # auth-service is internal — network hiccups are transient
      auth-service:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          # Domain exceptions should not be retried — they indicate bad state, not transient failure
          - com.healthcare.doctor.exception.DoctorException
          - com.healthcare.doctor.exception.ClinicException
 
      # Used by: cancelAvailableSlotsForDay, triggerSlotGeneration in ClinicScheduleServiceImpl
      # Both are non-critical — fallback handles gracefully without blocking schedule update
      appointment-service:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException

