# config for doctor (all profiles)

server:
  port: 8083

spring:
  application:
    name: doctor

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  cloud:
    openfeign:
      okhttp:
        enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  integrations:
    cloudinary:
      enabled: true
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}

info:
  app:
    name: "LuneCare Doctor Service"
    version: "v1.0.0"
    description: "Service for managing doctor profiles and availability."
