# config for admin (all profiles)

server:
  port: 8088

spring:
  application:
    name: admin

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  cloud:
    openfeign:
      okhttp:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      doctor-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

      auth-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

info:
  app:
    name: "LuneCare Admin Service"
    version: "v1.0.0"
    description: "Administrative service providing API documentation, monitoring interfaces, and management capabilities for the LuneCare healthcare microservices ecosystem."
