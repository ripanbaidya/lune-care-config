# config for feedback (all profiles)

server:
  port: 8087

spring:
  application:
    name: feedback

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

rabbitmq:
  exchange:
    name: lune.care.exchange
  queues:
    # Queue triggered when an appointment is completed (used for feedback processing)
    appointment-completed: feedback.appointment.completed.queue

info:
  app:
    name: "LuneCare Feedback Service"
    version: "v1.0.0"
    description: "Service responsible for collecting, managing, and processing patient feedback and reviews within the LuneCare healthcare microservices ecosystem."
