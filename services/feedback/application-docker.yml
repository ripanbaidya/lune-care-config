# config for feedback - docker profile
# Loaded when SPRING_PROFILES_ACTIVE=dev,docker (fully containerized dev stack)
# Overrides localhost references from application-dev.yml to Docker service names.

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:mongouser}:${MONGO_PASSWORD:mongopass}@feedback-db:27017/feedback_db?authSource=admin