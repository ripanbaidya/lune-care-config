# config for patient (all profiles)

server:
  port: 8082

spring:
  application:
    name: patient

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: patient
    default_schema: patient

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: patient

  data:
    redis:
      database: 0

app:
  integrations:
    cloudinary:
      enabled: true
      cloud-name: '{cipher}e46ac8244871a11a1127f8660f1bed6dc1a0b71c352211b27a175c774ac5c036'
      api-key: '{cipher}202614d6852f17bb293b81a4bb4ef204829d6a3c44431d39a5e20a675fed025f'
      api-secret: '{cipher}6854cdbf62fe461e8338bbd79530c60b5e7dc9fc2bdc2c536996d3426b8ab73e9f8685fbc390b6801775f21d154869cb'

info:
  app:
    name: "LuneCare Patient Service"
    version: "v1.0.0"
    description: "Service responsible for managing patient profiles, medical information, and related healthcare data within the LuneCare microservices ecosystem."
