# config for notification (all profiles)

server:
  port: 8086

spring:
  application:
    name: notification

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

rabbitmq:
  exchange:
    name: lune.care.exchange
  queues:
    appointment-events: notification.appointment.events.queue

info:
  app:
    name: "LuneCare Notification Service"
    version: "v1.0.0"
    description: "Service for processing and delivering notifications."
