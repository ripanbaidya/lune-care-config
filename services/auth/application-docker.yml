# config for auth - docker profile
# Loaded when SPRING_PROFILES_ACTIVE=dev,docker (fully containerized dev stack)
# Overrides localhost references from application-dev.yml to Docker service names.
# Do NOT use this profile when running services via IDE (use dev profile only).

spring:
  datasource:
    url: jdbc:postgresql://auth-db:5432/auth_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}