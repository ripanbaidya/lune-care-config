# config for auth (all profiles)

server:
  port: 8081

spring:
  application:
    name: auth

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: auth
    default_schema: auth

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: auth

  data:
    redis:
      database: 0

resilience4j:
  retry:
    instances:
      # Used by: createPatientProfile, createDoctorProfile in AuthServiceImpl
      # 2 attempts profile creation is non-fatal; we try once more before giving up and logging
      # for reconciliation. No point in more retries since patient registration latency is user-facing.
      profile-creation:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          # 409 Conflict is expected when profile already created/ exists
          - feign.FeignException$Conflict

app:
  security:
    jwt:
      issuer: "LuneCare"
      header: "Authorization"
      prefix: "Bearer "
      access-token:
        expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600000} # 1h
      refresh-token:
        expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000} # 7d
    
    rsa:
      algorithm: "RSA"
      private-key-path: secrets/keys/private_key.pem
      public-key-path: secrets/keys/public_key.pem

info:
  app:
    name: "LuneCare Authentication & Authorization Service"
    version: "v1.0.0"
    description: "Core security service responsible for user authentication, authorization, and JWT-based identity management within the LuneCare healthcare microservices ecosystem."
