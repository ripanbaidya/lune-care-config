# NOTE: This config-server does not read its own configuration from any external source (e.g., a Git repository).
# This file is included in the repository for reference and sharing purposes only.
# The config-server will use its local configuration at runtime.

server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          default-label: main
          timeout: 10
          force-pull: true
          clone-on-start: true
          refresh-rate: 30
          search-paths:
            - "."
            - "services/{application}"
            - "infrastructure/{application}"

    bus:
      enabled: true
      id: ${spring.application.name}:${server.port}

info:
  app:
    name: "LuneCare Configuration Server"
    version: "v1.0.0"
    description: "Centralized configuration service powered by Spring Cloud Config."
